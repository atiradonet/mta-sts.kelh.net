<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wittgenstein Quote</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --accent: #0f766e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 3rem 1.5rem;
      background: radial-gradient(circle at 20% 20%, #e0f2fe, #f5f7fb 38%), radial-gradient(circle at 80% 30%, #ccfbf1, #f5f7fb 40%);
      color: var(--text);
      font-family: "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(15, 23, 42, 0.12);
      padding: 2.5rem;
    }

    h1 {
      margin: 0 0 1.25rem;
      font-size: 2rem;
      letter-spacing: -0.01em;
    }

    figure {
      margin: 0;
    }

    blockquote {
      margin: 0 0 1.5rem;
      padding-left: 1rem;
      border-left: 4px solid var(--accent);
      font-size: 1.2rem;
      font-weight: 600;
    }

    figcaption {
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <main>
    <h1>On Speaking Clearly</h1>
    <figure>
      <blockquote>
        “Everything that can be thought can be thought clearly. Everything that can be said can be said clearly.”
      </blockquote>
      <figcaption>
        — Ludwig Wittgenstein, <cite>Tractatus Logico-Philosophicus</cite> 4.116
      </figcaption>
    </figure>
  </main>
</body>
</html>
